<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简历工作台</title><link rel="stylesheet" href="/editor/bundle.css"></head><body>
<header class="topbar"><div class="brand"><span class="brandmark" aria-hidden="true">R</span><div><h1>简历工作台</h1><span class="subtitle">专注内容，排版交给模板</span></div></div><div class="top-actions"><span id="save-state" role="status">正在连接…</span><button id="open-button" disabled>导入</button><details class="export-menu"><summary>更多导出</summary><div><button id="export-png" disabled>导出 PNG 图片</button><button id="download-source" disabled>导出 Markdown 原稿</button></div></details><button id="export-pdf" class="primary" disabled>导出 PDF</button><input type="file" id="file-input" accept=".md,.markdown,text/markdown,text/plain" hidden></div></header>
<div class="document-settings"><div><span class="setting-label">简历模板</span><strong id="template-name">正在加载</strong><button id="template-button" disabled aria-haspopup="dialog">切换模板</button></div><label for="font-size">全文字号 <select id="font-size" disabled><option value="8">8 pt</option><option value="8.5">8.5 pt</option><option value="9">9 pt</option><option value="9.5">9.5 pt</option><option value="10">10 pt</option><option value="10.5">10.5 pt</option><option value="11">11 pt</option><option value="11.5">11.5 pt</option><option value="12">12 pt</option><option value="12.5">12.5 pt</option><option value="13">13 pt</option><option value="13.5">13.5 pt</option><option value="14">14 pt</option><option value="14.5">14.5 pt</option><option value="15">15 pt</option><option value="15.5">15.5 pt</option><option value="16">16 pt</option><option value="16.5">16.5 pt</option><option value="17">17 pt</option><option value="17.5">17.5 pt</option><option value="18">18 pt</option></select></label><details class="advanced"><summary>更多设置</summary><div><label for="pages">预期页数 <input id="pages" type="number" min="1" max="20" value="1"></label><p>排版超出预期页数时，会提示调整内容或字号。</p><button id="build-button">重新生成预览</button></div></details></div>
<div class="content-toolbar" aria-label="文字格式"><button id="undo-button" disabled title="撤销">↶<span class="sr-only">撤销</span></button><button id="redo-button" disabled title="重做">↷<span class="sr-only">重做</span></button><span class="divider"></span><button id="bold-button" disabled aria-pressed="false" title="选中文字后加粗"><strong>B</strong><span class="sr-only">加粗</span></button><label for="selection-size">字号 <select id="selection-size" disabled><option value="">跟随模板</option><option value="8">8 pt</option><option value="8.5">8.5 pt</option><option value="9">9 pt</option><option value="9.5">9.5 pt</option><option value="10">10 pt</option><option value="10.5">10.5 pt</option><option value="11">11 pt</option><option value="11.5">11.5 pt</option><option value="12">12 pt</option><option value="12.5">12.5 pt</option><option value="13">13 pt</option><option value="13.5">13.5 pt</option><option value="14">14 pt</option><option value="14.5">14.5 pt</option><option value="15">15 pt</option><option value="15.5">15.5 pt</option><option value="16">16 pt</option><option value="16.5">16.5 pt</option><option value="17">17 pt</option><option value="17.5">17.5 pt</option><option value="18">18 pt</option><option value="18.5">18.5 pt</option><option value="19">19 pt</option><option value="19.5">19.5 pt</option><option value="20">20 pt</option><option value="20.5">20.5 pt</option><option value="21">21 pt</option><option value="21.5">21.5 pt</option><option value="22">22 pt</option><option value="22.5">22.5 pt</option><option value="23">23 pt</option><option value="23.5">23.5 pt</option><option value="24">24 pt</option><option value="24.5">24.5 pt</option><option value="25">25 pt</option><option value="25.5">25.5 pt</option><option value="26">26 pt</option><option value="26.5">26.5 pt</option><option value="27">27 pt</option><option value="27.5">27.5 pt</option><option value="28">28 pt</option><option value="28.5">28.5 pt</option><option value="29">29 pt</option><option value="29.5">29.5 pt</option><option value="30">30 pt</option><option value="30.5">30.5 pt</option><option value="31">31 pt</option><option value="31.5">31.5 pt</option><option value="32">32 pt</option></select></label><span class="divider"></span><button id="logo-toggle" disabled aria-haspopup="dialog">插入图标</button><label for="logo-size">图标大小 <input id="logo-size" type="number" min="8" max="48" step="0.5" value="16" disabled><span class="unit">pt</span></label><select id="add-block" aria-label="添加内容" disabled><option value="">＋ 添加内容</option><option value="section">章节标题</option><option value="entry">经历条目</option><option value="bullet">经历要点</option><option value="paragraph">普通文字</option></select></div>
<main class="workspace"><section class="editor panel" aria-labelledby="editor-title"><div class="panel-heading"><h2 id="editor-title">编辑简历</h2><span class="muted">直接点击文字修改</span></div><p class="editing-hint" id="selection-hint">选中文字可加粗、调字号；点击图标可调大小</p><div id="editor-host" aria-label="简历可视化编辑区"></div></section>
<section class="preview panel" aria-labelledby="preview-title"><div class="panel-heading"><div class="panel-title"><h2 id="preview-title">PDF 预览</h2><span id="preview-state" role="status">准备预览</span><span id="page-count"></span></div><label class="scroll-option"><input type="checkbox" id="linked-scroll" checked> 同步滚动</label><label class="sr-only" for="zoom">两侧缩放</label><select id="zoom"><option value="fit">适应宽度</option><option value="100">100%</option></select></div><p class="preview-caption">相同纸张与缩放 · 最终换行和分页以 PDF 为准</p><div id="error-box" role="alert" hidden><strong>操作未完成</strong><p id="error-message"></p><details><summary>查看详细信息</summary><pre id="error-log"></pre></details></div><div class="preview-wrap"><div id="preview-host" aria-label="简历排版预览"></div></div></section></main>
<footer>内容保存在本机 · 可随时导出原稿，继续编辑</footer>
<dialog id="template-dialog" aria-labelledby="template-dialog-title"><div class="dialog-heading"><div><h2 id="template-dialog-title">选择简历模板</h2><p>保留文字，切换排版。缩略图为示例内容。</p></div><button id="template-close">关闭</button></div><div id="template-grid" class="template-grid"></div></dialog>
<dialog id="logo-dialog" aria-labelledby="logo-dialog-title"><div class="dialog-heading"><div><h2 id="logo-dialog-title">插入图标</h2><p>插入后点击图标，即可在工具栏调整大小。</p></div><button id="logo-close">关闭</button></div><div class="logo-filters"><input id="logo-search" type="search" aria-label="搜索图标" placeholder="搜索学校或公司，如：北邮、GitHub"><select id="logo-category" aria-label="图标类别"><option value="">全部图标</option><option value="school">学校</option><option value="brand">公司与技术</option></select><label for="insert-logo-size">大小 <input id="insert-logo-size" type="number" min="8" max="48" step="0.5" value="16"> pt</label></div><div id="logo-list" class="logo-list"></div><p id="logo-empty" hidden>未找到匹配的图标，试试学校简称或英文名称。</p><p class="dialog-footnote">图标用于标识学校或机构，相关权利归原权利人。</p></dialog>
<script src="/editor/bundle.js" defer></script></body></html>
