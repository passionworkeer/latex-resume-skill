name: Build fictional examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify bundled open-source editor
        run: |
          npm ci
          npm run build
          npm test
          git diff --exit-code -- skills/latex-resume/assets/editor/bundle.js skills/latex-resume/assets/editor/bundle.css skills/latex-resume/assets/editor/THIRD_PARTY_NOTICES.md
      - name: Prepare local dependencies
        run: python skills/latex-resume/scripts/setup.py
      - name: Tests and examples
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m unittest discover -s tests -v
          "$PY" skills/latex-resume/scripts/build.py --source skills/latex-resume/assets/templates/example-zh.md --output output/example-zh
          "$PY" skills/latex-resume/scripts/build.py --source skills/latex-resume/assets/templates/example-en.md --output output/example-en
          "$PY" skills/latex-resume/scripts/build.py --source skills/latex-resume/assets/templates/example-logos.md --output output/example-logos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fictional-examples-${{ matrix.os }}
          path: |
            output/**/*.pdf
            output/**/*.png
            output/**/*.json
            output/**/*.log
          if-no-files-found: ignore
